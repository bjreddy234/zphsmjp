<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIII Classes Reading Performance</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    text-align:center;
    color:white;
    background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364);
    background-size:400% 400%;
    animation:bg 8s infinite alternate;
}

@keyframes bg{
    0%{background-position:left;}
    100%{background-position:right;}
}

/* Marquee Heading */
marquee{
    font-size:28px;
    font-weight:bold;
    text-shadow:2px 2px 6px black;
    margin-top:15px;
}

.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:40px;
    margin-top:30px;
}

.chart-box{
    width:280px;
}

.pie{
    width:250px;
    height:250px;
    border-radius:50%;
    margin:auto;
    box-shadow:0 0 20px rgba(0,0,0,0.6);
    animation:rotate 15s linear infinite;
}

@keyframes rotate{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

/* VIII A */
.pieA{
    background: conic-gradient(
        #00c6ff 0% 44%,
        #ff4d4d 44% 100%
    );
}

/* VIII B */
.pieB{
    background: conic-gradient(
        #00ff99 0% 50%,
        #ffcc00 50% 100%
    );
}

/* Labels - Bigger & Bold */
.labels{
    margin-top:15px;
    font-size:24px;
    font-weight:bold;
    line-height:1.8;
    text-shadow:2px 2px 5px black;
}

.labels span{
    display:block;
}
</style>

</head>

<body>

<marquee behavior="alternate">📊 VIII CLASSES - READING PERFORMANCE 📊</marquee>

<div class="container">

<div class="chart-box">
    <h2>VIII A</h2>
    <div class="pie pieA"></div>
    <div class="labels">
        <span>🔵 Telugu - 12/34</span>
        <span>🔴 English - 15/34</span>
    </div>
</div>

<div class="chart-box">
    <h2>VIII B</h2>
    <div class="pie pieB"></div>
    <div class="labels">
        <span>🟢 Telugu - 13/35</span>
        <span>🟡 English - 13/35</span>
    </div>
</div>

</div>

</body>
</html>
