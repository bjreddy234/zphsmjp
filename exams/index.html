<style>

/* BODY */
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(120deg,#0f2027,#203a43,#2c5364,#4facfe,#eaf3ff);
    background-size: 300% 300%;
    animation: bg 20s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* MARQUEE */
.marquee{
    background:#00008B;
    color:#fff;
    padding:15px;
    font-size:24px;
    font-weight:bold;
    overflow:hidden;
    white-space:nowrap;
}

.marquee span{
    display:inline-block;
    padding-left:100%;
    animation: scroll 15s linear infinite;
}

@keyframes scroll{
    0%{ transform: translateX(0); }
    100%{ transform: translateX(-100%); }
}

/* MAIN */
.main{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:75vh;
    gap:25px;
}

/* CARD */
.info-card{
    background:#ffffffcc;
    padding:18px 28px;
    border-radius:14px;
    font-size:20px;
    font-weight:bold;
    text-align:center;

    box-shadow:0 6px 15px rgba(0,0,0,0.2);
    animation: glowBorder 2s infinite alternate;
}

/* GLOW */
@keyframes glowBorder{
    0%{
        box-shadow:0 0 5px red,0 0 10px orange,0 0 15px yellow,0 0 20px green;
    }
    50%{
        box-shadow:0 0 10px cyan,0 0 20px blue,0 0 30px violet,0 0 40px pink;
    }
    100%{
        box-shadow:0 0 5px red,0 0 10px orange,0 0 15px yellow,0 0 20px green;
    }
}

/* BUTTON */
.btn{
    width:380px;
    padding:22px;
    font-size:20px;
    font-weight:bold;
    border:none;
    border-radius:50px;
    cursor:pointer;

    background:linear-gradient(45deg,#ffffff,#e3f2fd);
    color:#000;

    transition:0.3s;
    box-shadow:0 6px 15px rgba(0,0,0,0.3);
}

.btn:hover{
    background:#0d47a1;
    color:#fff;
    transform:scale(1.07);
}

/* MOBILE */
@media(max-width:600px){

    .main{
        height:auto;
        padding:20px;
    }

    .btn{
        width:100%;
        font-size:18px;
        padding:18px;
    }

    .marquee{
        font-size:18px;
    }

    .info-card{
        font-size:16px;
    }
}

</style>
</head>

<body>

<div class="marquee">
<span>
SSC PUBLIC EXAMS, MARCH 2026 &nbsp;&nbsp; | &nbsp;&nbsp;
SUMMATIVE II - EXAMS, APRIL 2026
</span>
</div>

<div class="main">

<div class="info-card">
Click on the respective link to open the Exams schedule
</div>

<a href="ss/">
    <button class="btn">SSC Public Examinations, March 2026</button>
</a>

<a href="SA2/">
    <button class="btn">SA2 Exams, April 2026</button>
</a>

</div>

</body>
