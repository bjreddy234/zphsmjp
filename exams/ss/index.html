<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSC EXAMS COMPLETED</title>

<style>

body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* BLINKING TEXT */
.blink-text{
    font-size:40px;
    font-weight:bold;
    color:#fff;
    text-align:center;
    animation: blink 1s infinite;
}

/* BLINK ANIMATION */
@keyframes blink{
    0%{ opacity:1; color:#00ffcc; }
    50%{ opacity:0; color:#ff0000; }
    100%{ opacity:1; color:#ffff00; }
}

</style>
</head>

<body>

<div class="blink-text">
    🎉 Congratulations on successful completion of SSC Exams 🎉
</div>
