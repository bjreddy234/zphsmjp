
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SA2 Exams Completed</title>

<style>

body{
    margin:0;
    font-family:'Segoe UI', sans-serif;
    background: radial-gradient(circle at bottom, #000000, #0f2027, #203a43);
    color:#fff;
    overflow:hidden;
}

/* HEADER */
.marquee{
    position:absolute;
    top:0;
    width:100%;
    background:#ffcc00;
    color:#000;
    padding:14px;
    font-weight:bold;
    font-size:28px;
    overflow:hidden;
    white-space:nowrap;
}
.marquee span{
    display:inline-block;
    padding-left:100%;
    animation: scroll 15s linear infinite;
}
@keyframes scroll{
    0%{ transform: translateX(0); }
    100%{ transform: translateX(-100%); }
}

/* CENTER CONTENT */
.container{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

/* ✅ IMPROVED BLINK + GLOW */
.blink{
    font-size:48px;
    font-weight:900;
    color:#ffffff;

    text-shadow:
        0 0 10px #ffffff,
        0 0 20px #00ffff,
        0 0 40px #00ffff,
        0 0 60px #00ffff;

    animation: blinkClear 1.2s infinite, glowShift 2s infinite alternate;
}

@keyframes blinkClear{
    0%,100%{ opacity:1; }
    50%{ opacity:0.2; }
}

@keyframes glowShift{
    0%{
        text-shadow:
            0 0 10px #ffffff,
            0 0 20px #00ffff,
            0 0 40px #00ffff,
            0 0 60px #00ffff;
    }
    100%{
        text-shadow:
            0 0 10px #ffffff,
            0 0 20px #ffcc00,
            0 0 40px #ffcc00,
            0 0 60px #ffcc00;
    }
}

/* BACK BUTTON (UNCHANGED) */
.back-btn{
    display:inline-block;
    margin-top:30px;
    padding:12px 25px;
    background:#ffcc00;
    color:#000;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
    border-radius:30px;
    box-shadow:0 0 10px #000;
    transition:0.3s;
}

.back-btn:hover{
    background:#ff0000;
    color:#fff;
    box-shadow:0 0 15px red, 0 0 25px yellow;
}

/* CONFETTI */
.confetti{
    position:absolute;
    width:10px;
    height:10px;
    top:-10px;
    animation: fall linear infinite;
}
@keyframes fall{
    to{
        transform: translateY(100vh) rotate(720deg);
    }
}

/* FIREWORK CANVAS */
canvas{
    position:fixed;
    top:0;
    left:0;
    pointer-events:none;
}

</style>
</head>

<body>

<div class="marquee">
<span>🏫 ZILLA PARISHAD HIGH SCHOOL MUJAHIDPUR AND MUJAHIDPUR SCHOOL COMPLEX</span>
</div>

<canvas id="fireworks"></canvas>

<div class="container">
<div class="blink">
🎉 Congratulations on Successful Completion of SA2 Exams 🎉
</div>

<a href="../" class="back-btn">⬅ Back to Exams Page</a>
</div>

<!-- SOUND -->
<audio id="sound" src="https://www.soundjay.com/human/applause-8.mp3"></audio>

<script>

/* 🔊 SOUND */
window.onload = function(){
    document.getElementById("sound").play().catch(()=>{});
};

/* 🎉 CONFETTI */
for(let i=0;i<80;i++){
    let c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.backgroundColor=`hsl(${Math.random()*360},100%,50%)`;
    c.style.animationDuration=(2+Math.random()*3)+"s";
    document.body.appendChild(c);
}

/* 🎆 FIREWORKS */
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function createFirework(){
    let x=Math.random()*canvas.width;
    let y=Math.random()*canvas.height/2;
    for(let i=0;i<50;i++){
        particles.push({
            x:x,
            y:y,
            angle:Math.random()*2*Math.PI,
            speed:Math.random()*5+2,
            life:100
        });
    }
}

function animate(){
    ctx.fillStyle="rgba(0,0,0,0.2)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    particles.forEach((p,i)=>{
        p.x+=Math.cos(p.angle)*p.speed;
        p.y+=Math.sin(p.angle)*p.speed;
        p.life--;

        ctx.fillStyle="hsl("+Math.random()*360+",100%,50%)";
        ctx.fillRect(p.x,p.y,3,3);

        if(p.life<=0) particles.splice(i,1);
    });

    requestAnimationFrame(animate);
}

setInterval(createFirework,800);
animate();

</script>

</body>
</html>
