<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SA2 Exams Completed</title>

<style>

body{
    margin:0;
    font-family:'Segoe UI', sans-serif;
    background: radial-gradient(circle at bottom, #000000, #0f2027, #203a43);
    color:#fff;
    overflow:hidden;
}

/* HEADER */
.marquee{
    position:absolute;
    top:0;
    width:100%;
    background:#ffcc00;
    color:#000;
    padding:12px;
    font-weight:bold;
    font-size:20px;
    overflow:hidden;
    white-space:nowrap;
}
.marquee span{
    display:inline-block;
    padding-left:100%;
    animation: scroll 20s linear infinite;
}

/* CENTER */
.container{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    width:90%;
}

/* TEXT */
.blink{
    font-size:34px;
    font-weight:900;
    color:#ffffff;
    text-shadow:0 0 10px #fff,0 0 20px #00ffff,0 0 40px #00ffff;
    animation: blinkClear 1.5s infinite;
}

@keyframes blinkClear{
    0%,100%{opacity:1;}
    50%{opacity:0.3;}
}

/* BUTTON */
.back-btn{
    display:inline-block;
    margin-top:25px;
    padding:10px 20px;
    background:#ffcc00;
    color:#000;
    text-decoration:none;
    font-size:16px;
    font-weight:bold;
    border-radius:30px;
}

/* CONFETTI (LIGHT VERSION) */
.confetti{
    position:absolute;
    width:6px;
    height:6px;
    top:-10px;
    animation: fall linear infinite;
}

@keyframes fall{
    to{ transform: translateY(100vh) rotate(360deg); }
}

/* FIREWORK CANVAS */
canvas{
    position:fixed;
    top:0;
    left:0;
    pointer-events:none;
}

/* 📱 MOBILE OPTIMIZATION */
@media(max-width:600px){

    .blink{
        font-size:26px;
    }

    canvas{
        display:none; /* 🔥 disable fireworks on mobile */
    }

}

</style>
</head>

<body>

<div class="marquee">
<span>🏫 ZILLA PARISHAD HIGH SCHOOL MUJAHIDPUR AND MUJAHIDPUR SCHOOL COMPLEX</span>
</div>

<canvas id="fireworks"></canvas>

<div class="container">
<div class="blink">
🎉 Congratulations on Successful Completion of SA2 Exams 🎉
</div>

<a href="../" class="back-btn">⬅ Back to Exams Page</a>
</div>

<!-- SOUND -->
<audio id="sound" src="https://www.soundjay.com/human/applause-8.mp3"></audio>

<script>

/* 🔊 SOUND (safe play) */
window.onload = function(){
    document.getElementById("sound").play().catch(()=>{});
};

/* 🎉 CONFETTI (REDUCED) */
let confettiCount = window.innerWidth < 600 ? 30 : 60;

for(let i=0;i<confettiCount;i++){
    let c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.backgroundColor=`hsl(${Math.random()*360},100%,50%)`;
    c.style.animationDuration=(3+Math.random()*3)+"s";
    document.body.appendChild(c);
}

/* 🎆 FIREWORKS (ONLY DESKTOP) */
if(window.innerWidth > 600){

const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function createFirework(){
    let x=Math.random()*canvas.width;
    let y=Math.random()*canvas.height/2;
    for(let i=0;i<25;i++){  // reduced particles
        particles.push({
            x:x,
            y:y,
            angle:Math.random()*2*Math.PI,
            speed:Math.random()*3+1,
            life:80
        });
    }
}

function animate(){
    ctx.fillStyle="rgba(0,0,0,0.2)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    particles.forEach((p,i)=>{
        p.x+=Math.cos(p.angle)*p.speed;
        p.y+=Math.sin(p.angle)*p.speed;
        p.life--;

        ctx.fillStyle="hsl("+Math.random()*360+",100%,50%)";
        ctx.fillRect(p.x,p.y,2,2);

        if(p.life<=0) particles.splice(i,1);
    });

    requestAnimationFrame(animate);
}

setInterval(createFirework,1200); // slower
animate();

}

</script>

</body>
</html>
